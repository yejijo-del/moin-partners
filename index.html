<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모인 파트너스 - 콘텐츠로 수익을 만드는 가장 쉬운 방법</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        /* 기존 스타일은 완벽하므로 그대로 유지합니다 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0082FF; --primary-dark: #0066CC; --turquoise: #2EC4B6;
            --gradient: linear-gradient(135deg, #2EC4B6 0%, #0082FF 100%);
            --dark: #1a1a1a; --gray-100: #f8f9fa; --gray-200: #e9ecef; --gray-600: #6c757d;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08); --shadow-md: 0 4px 20px rgba(0,0,0,0.12); --shadow-lg: 0 10px 40px rgba(0,0,0,0.15);
        }
        body { font-family: 'Pretendard', sans-serif; line-height: 1.6; color: var(--dark); overflow-x: hidden; }
        header { position: fixed; top: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 1000; box-shadow: var(--shadow-sm); }
        nav { max-width: 1200px; margin: 0 auto; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--dark); font-weight: 500; }
        .cta-button { background: var(--gradient); color: white; padding: 0.7rem 1.8rem; border-radius: 50px; text-decoration: none; font-weight: 600; }
        .hero { margin-top: 80px; padding: 6rem 2rem; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); text-align: center; }
        .hero h1 { font-size: 3.5rem; font-weight: 900; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stats { padding: 4rem 2rem; background: white; }
        .stats-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 3rem; text-align: center; }
        .stat-number { font-size: 3rem; font-weight: 900; color: var(--primary); }
        .features { padding: 6rem 2rem; background: var(--gray-100); }
        .features-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; }
        .feature-card { background: white; padding: 2.5rem; border-radius: 20px; box-shadow: var(--shadow-sm); }
        .faq { padding: 6rem 2rem; background: white; }
        .faq-container { max-width: 900px; margin: 0 auto; }
        .faq-item { background: var(--gray-100); margin-bottom: 1rem; border-radius: 15px; overflow: hidden; }
        .faq-question { padding: 1.5rem 2rem; cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .faq-answer { padding: 0 2rem 1.5rem; color: var(--gray-600); display: none; }
        .faq-item.active .faq-answer { display: block; }
        .faq-item.active .faq-icon { transform: rotate(180deg); }
        .cta-section { padding: 6rem 2rem; background: var(--gradient); color: white; text-align: center; }
        .btn-white { background: white; color: var(--primary); padding: 1.2rem 3rem; border-radius: 50px; text-decoration: none; font-weight: 700; display: inline-block; margin-top: 1rem; }
        footer { padding: 3rem 2rem; background: var(--dark); color: white; text-align: center; }
        .footer-content { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem; }
        .footer-links { list-style: none; padding: 0; }
        .footer-links a { color: #aaa; text-decoration: none; }
        @media (max-width: 768px) { .nav-links { display: none; } .hero h1 { font-size: 2.5rem; } }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo-container">
                <span style="font-size: 1.5rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">모인 파트너스</span>
            </div>
            <div class="nav-links">
                <a href="#features">특징</a>
                <a href="#how-it-works">시작하기</a>
                <a href="#faq">FAQ</a>
                <a href="https://tally.so/r/w8K9Ak" class="cta-button">신청하기</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <h1>콘텐츠로 수익을 만드는<br>가장 쉬운 방법</h1>
        <p>해외송금이 필요한 사람에게 모인을 소개하고 리워드를 받아보세요!</p>
        <div style="margin-top: 2rem;">
            <a href="https://tally.so/r/w8K9Ak" class="btn-white" style="background: var(--primary); color: white;">모인 파트너스 신청</a>
        </div>
    </section>

    <section id="faq" class="faq">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h2 style="font-size: 2.5rem; font-weight: 900;">자주 묻는 질문</h2>
        </div>
        <div class="faq-container">
            <div class="faq-item">
                <div class="faq-question" onclick="toggleFAQ(this)">
                    <span>파트너스 프로그램은 누구나 신청할 수 있나요?</span>
                    <span class="faq-icon">▼</span>
                </div>
                <div class="faq-answer">네, 개인 크리에이터, 인플루언서, 커뮤니티 운영자 모두 신청 가능합니다.</div>
            </div>
            <div class="faq-item">
                <div class="faq-question" onclick="toggleFAQ(this)">
                    <span>리워드는 언제 받나요?</span>
                    <span class="faq-icon">▼</span>
                </div>
                <div class="faq-answer">매월 10일에 정산 금액을 지급해 드립니다.</div>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <div>
                <p>문의: <a href="mailto:growth@themoin.com" style="color: var(--turquoise); text-decoration: none;">growth@themoin.com</a></p>
            </div>
        </div>
        <div style="margin-top: 2rem; border-top: 1px solid #333; padding-top: 1rem;">
            © 2026 주식회사 모인. All rights reserved.
        </div>
    </footer>

    <script>
        // FAQ 토글 함수 (전역 범위 배치)
        function toggleFAQ(element) {
            const item = element.parentElement;
            item.classList.toggle('active');
        }

        // 스무스 스크롤
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    window.scrollTo({
                        top: target.offsetTop - 80,
                        behavior: 'smooth'
                    });
                }
            });
        });
    </script>
</body>
</html>
